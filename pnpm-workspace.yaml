minimumReleaseAge: 4320 # nosemgrep: package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age

allowBuilds:
  "@parcel/watcher": true
  "@prisma/engines": true
  "@scarf/scarf": set this to true or false
  "@swc/core": true
  better-sqlite3: false
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

overrides:
  "effect@<=3.22.0": "3.22.1"
  # Keep Stryker on the patched runtime dependencies.
  "@stryker-mutator/core>minimatch": 11.0.5
  "typed-rest-client@2.3.1>qs": ^6.16.1
  minimatch@>=7.0.0 <11.0.1: 11.0.1
