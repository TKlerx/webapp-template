  zod@>=4.0.0 <4.6.7: ^4.6.7
  brace-expansion@>=5.0.0 <5.0.12: ^5.0.12
  undici: 8.12.2
  "@hono/node-server": 2.1.3
  hono@<4.13.11: ^4.13.11
  qs@>=6.7.0 <=6.16.0: ^6.16.1
minimumReleaseAgeExclude:
  - qs@6.16.1
  - hono@4.13.11
  - "@hono/node-server@2.1.3"
  - undici@8.12.2
