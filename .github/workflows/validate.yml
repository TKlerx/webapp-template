name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  joern:
    name: Joern security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2 -Xmx768m -Xms64m
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Install pinned Joern
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/joernio/joern/releases/download/v4.0.650/joern-cli-linux-x86_64.zip -o "$RUNNER_TEMP/joern.zip"
          echo "a2f4b0fd22e805b2503c0646c3929d4469f621d986f12af3e4b66ee87c5ba62f  $RUNNER_TEMP/joern.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/joern.zip" -d "$RUNNER_TEMP/joern"
      - name: Verify controls and analyze current application
        shell: pwsh
        run: ./security-analysis/joern/codeql-port/run-application.ps1 -JoernHome "$env:RUNNER_TEMP/joern/joern-cli"
      - name: Upload analysis evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: joern-analysis
          retention-days: 14
          path: |
            security-analysis/joern/codeql-port/**/*.json
            security-analysis/joern/codeql-port/**/*.log
          if-no-files-found: warn

  validate:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /app-starter
      E2E_BASE_PATH: /app-starter
      AUTH_BASE_URL: http://localhost:3290/app-starter
      BETTERAUTH_SECRET: ci-betterauth-secret-for-playwright-tests-only
      TEST_DATABASE_URL: postgresql://starter:starter_e2e_password@127.0.0.1:55432/business_app_starter_e2e_test

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # v2.0.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit all application dependencies
        run: pnpm audit --audit-level low

      - name: Install worker dependencies
        working-directory: worker
        run: uv sync --all-groups --locked

      - name: Audit all worker dependencies
        working-directory: worker
        run: uv audit --frozen

      - name: Audit all CLI module dependencies
        working-directory: cli
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -scan=module

      - name: Generate Prisma client
        run: pnpm run prisma:generate

      - name: Provision isolated PostgreSQL test database
        run: node scripts/ensure-e2e-db.mjs

      - name: Install Semgrep
        run: python -m pip install semgrep

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.71.0

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run full validation
        run: pnpm run validate:full
